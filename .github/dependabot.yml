# Keeps the Claude Agent SDK current: FORGE should follow Claude Code closely. Only this package, because
# the rest of the dependencies are updated on purpose. PRs go to dev and run ci.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/sidecar
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
    commit-message:
      prefix: "SDK"
